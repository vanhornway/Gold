name: 6-Hour Gold Data Sync

on:
  schedule:
    # Runs at minute 0 past hour 0, 6, 12, 18 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows clicking 'Run workflow' manually anytime

permissions:
  contents: write

jobs:
  sync-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Scraper & Math Engine
        env:
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: |
          python scripts/update_data.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh: 6-Hour Gold Market Sync [skip ci]" && git push)
